services:
  db:
    image: postgres:16-alpine
    container_name: zastermaster-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zaster
      POSTGRES_PASSWORD: zaster
      POSTGRES_DB: zastermaster
    volumes:
      - zastermaster_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaster -d zastermaster"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zastermaster_pgdata:
